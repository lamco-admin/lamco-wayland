name: CI

on:
  push:
    branches: [ master, main, "release/**" ]
  pull_request:
    branches: [ master, main, "release/**" ]

env:
  CARGO_TERM_COLOR: always
  # libspa-sys / pipewire-sys generate bindings with bindgen, which needs libclang.
  SYSTEM_DEPS: libpipewire-0.3-dev clang pkg-config

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire system deps
        run: sudo apt-get update && sudo apt-get install -y $SYSTEM_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire system deps
        run: sudo apt-get update && sudo apt-get install -y $SYSTEM_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Lint both feature modes: optional features (yuv/damage/audio) gate real
      # code, so --all-features alone is not a superset of the default build.
      - name: Clippy (default features)
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire system deps
        run: sudo apt-get update && sudo apt-get install -y $SYSTEM_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire system deps
        run: sudo apt-get update && sudo apt-get install -y $SYSTEM_DEPS
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@v2
      - name: Check on MSRV (all features)
        run: cargo check --workspace --all-features --all-targets

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire system deps
        run: sudo apt-get update && sudo apt-get install -y $SYSTEM_DEPS
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: smoke each fuzz target (60s)
        working-directory: crates/lamco-pipewire
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
