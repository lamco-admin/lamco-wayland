[graph]
all-features = true

[advisories]
# zbus, zvariant and zbus_names are marked unmaintained (2026-10) after the zbus
# project moved. They arrive through ashpd, which lamco-portal needs for the XDG
# portals, and there is no maintained replacement to move to; revisit when ashpd
# does.
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# The full all-features graph (ashpd/zbus D-Bus stack, the PipeWire FFI tree,
# tokio, image/codec helpers) is permissive-only. unused-allowed-license = allow
# keeps spare entries from erroring.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
