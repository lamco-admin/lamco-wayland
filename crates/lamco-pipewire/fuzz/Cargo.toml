[package]
name = "lamco-pipewire-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lamco-pipewire]
path = ".."
features = ["yuv", "damage"]

# Keep this crate out of the parent workspace (cargo-fuzz convention).
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "yuv"
path = "fuzz_targets/yuv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "damage"
path = "fuzz_targets/damage.rs"
test = false
doc = false
bench = false
